<VirtualHost *:80>
    DocumentRoot /var/www/WeddingSoulMates/frontend
    ServerName www.weddingsoulmates.com
    ServerAlias weddingsoulmates.com

    # Serve the React build
    <Directory /var/www/WeddingSoulMates/frontend>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # Add rewrite rules for React Router
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ /index.html [L]
        </IfModule>
    </Directory>

    # Proxy API requests to Node.js backend
    ProxyPass "/api/" "http://localhost:3000/"
    ProxyPassReverse "/api/" "http://localhost:3000/"

    # Redirect HTTP to HTTPS
    Redirect permanent / https://www.weddingsoulmates.com/
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/WeddingSoulMates/frontend
    ServerName www.weddingsoulmates.com
    ServerAlias weddingsoulmates.com

    # SSL configuration (use the combined file)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/weddingsoulmates_combined.crt
    SSLCertificateKeyFile /etc/ssl/private/weddingsoulmates.com.key

    # Serve the React build
    <Directory /var/www/WeddingSoulMates/frontend>
        Options FollowSymLinks
        AllowOverride All
        Require all granted

        # Add rewrite rules for React Router
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ /index.html [L]
        </IfModule>
    </Directory>

    # Proxy API requests to Node.js backend
    ProxyPass "/api/" "http://localhost:3000/"
    ProxyPassReverse "/api/" "http://localhost:3000/"
</VirtualHost>

<VirtualHost *:443>
    ServerName api.weddingsoulmates.com
    DocumentRoot /var/www/WeddingSoulMates/backend
    Alias /uploads/ /var/www/WeddingSoulMates/backend/uploads
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/api_combined_certificate.crt
    SSLCertificateKeyFile /etc/ssl/private/api_private.key
    # Proxy API requests to the Node.js backend
    ProxyPass "/" "http://localhost:4000/"
    ProxyPassReverse "/" "http://localhost:4000/"
	# Increase the request body size limit
    LimitRequestBody 0

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
